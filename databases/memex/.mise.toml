[tasks.deploy]
description = "Deploy CNPG cluster Memex"
run = "scripts/deploy.sh"

[tasks.destroy]
description = "Destroy CNPG cluster Memex"
run = "scripts/destroy.sh"

[tasks.diff]
description = "Show the helm diff for Memex and report drift"
run = "scripts/diff.sh"

[tasks.list-backups]
description = "List CNPG Memex backups"
run = "scripts/list-backups.sh"

[tasks.backup]
description = "Trigger immediate CNPG Memex backup"
run = "scripts/backup.sh"

[tasks.delete-backup]
description = "Delete a CNPG Memex backup by name"
run = "scripts/delete-backup.sh"

[tasks.enter-in-postgres-with-memex-user]
description = "Enter an interactive psql session as the memex user"
run = "scripts/enter-in-postgres-with-memex-user.sh"

[tasks.enter-in-postgres-with-toggl_mcp_reader-user]
description = "Enter an interactive psql session as the toggl_mcp_reader user"
run = "scripts/enter-in-postgres-with-toggl_mcp_reader-user.sh"

[tasks.doctor]
description = "Check the role configuration in the memex cluster"
run = "scripts/doctor.sh"