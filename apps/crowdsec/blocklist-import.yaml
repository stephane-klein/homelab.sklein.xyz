# CrowdSec blocklist-import CronJob — injects external threat feeds into LAPI.
# Deployed in the `crowdsec` namespace so it can reach the LAPI service.
# Before each import, an initContainer purges the expired decisions from the
# LAPI SQLite DB (which never auto-purges them — see docs/issues/4613). It runs
# via kubectl exec into the LAPI pod, hence the ServiceAccount + RBAC below.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-purge
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-purge
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-purge
  namespace: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-purge
subjects:
  - kind: ServiceAccount
    name: crowdsec-purge
    namespace: crowdsec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocklist-import-config
  namespace: crowdsec
data:
  # LAPI is reachable from the cluster via its Service.
  CROWDSEC_LAPI_URL: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
  CROWDSEC_MACHINE_ID: "blocklist-import"
  # Decision defaults
  DECISION_DURATION: "24h"
  DECISION_TYPE: "ban"
  DECISION_ORIGIN: "blocklist-import"
  DECISION_REASON: "external_blocklist"
  DECISION_SCENARIO: "external/blocklist"
  # Processing
  BATCH_SIZE: "1000"
  LOG_LEVEL: "INFO"
  # Save alert quota (free tier = 500 alerts/month) and stay off telemetry.
  CONSOLIDATE_ALERTS: "true"
  TELEMETRY_ENABLED: "false"
  METRICS_ENABLED: "false"
  # Auto-fetch GitHub ranges.
  ALLOWLIST_GITHUB: "true"
  # Safety cap: keeps the LAPI SQLite datastore responsive. The bouncer stream
  # and every decisions query degrade badly with hundreds of thousands of rows.
  # Raised to 80000 so IPsum + FireHOL are actually imported (the tool fills
  # the cap in feed order; at 50000 only IPsum would enter).
  MAX_DECISIONS: "80000"
  # Feed subset. All major feeds enabled; the purge-before-import (initContainer)
  # keeps the expired-decisions backlog bounded, which is what broke the bouncer
  # sync before (not the active decision count).
  ENABLE_IPSUM: "true"
  ENABLE_SPAMHAUS: "true"
  ENABLE_FIREHOL: "true"
  ENABLE_ABUSE_CH: "true"
  ENABLE_BLOCKLIST_DE: "true"
  ENABLE_EMERGING_THREATS: "true"
  # Disabled initially (false-positive / volume reasons).
  ENABLE_TOR: "false"
  ENABLE_SCANNERS: "false"
  ENABLE_STOPFORUMSPAM: "false"
  ENABLE_CI_ARMY: "false"
  ENABLE_BOTVRIJ: "false"
  ENABLE_GREENSNOW: "false"
  ENABLE_BINARY_DEFENSE: "false"
  ENABLE_BRUTEFORCE_BLOCKER: "false"
  ENABLE_DSHIELD: "false"
  ENABLE_ABUSE_IPDB: "false"
  ENABLE_CYBERCRIME_TRACKER: "false"
  ENABLE_MONTY_SECURITY_C2: "false"
  ENABLE_VXVAULT: "false"
  ENABLE_SENTINEL: "false"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blocklist-import
  namespace: crowdsec
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crowdsec-purge
          initContainers:
            - name: purge
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  kubectl exec -i -n crowdsec deploy/crowdsec-lapi -- sh -s <<'EOF'
                  command -v sqlite3 >/dev/null 2>&1 || apk add --no-cache sqlite >/dev/null 2>&1
                  DB=/var/lib/crowdsec/data/crowdsec.db
                  BEFORE=$(sqlite3 "$DB" "SELECT count(*) FROM decisions;")
                  ACTIVE=$(sqlite3 "$DB" "SELECT count(*) FROM decisions WHERE until > datetime('now','utc');")
                  sqlite3 "$DB" "DELETE FROM decisions WHERE until < datetime('now','utc');"
                  AFTER=$(sqlite3 "$DB" "SELECT count(*) FROM decisions;")
                  echo "purged expired decisions: $BEFORE -> $AFTER (active: $ACTIVE)"
                  EOF
          containers:
            - name: blocklist-import
              image: ghcr.io/wolffcatskyy/crowdsec-blocklist-import:3.7.1
              envFrom:
                - configMapRef:
                    name: blocklist-import-config
              env:
                # Credentials are read from the mounted secret (never inline).
                - name: CROWDSEC_LAPI_KEY_FILE
                  value: /secrets/lapi-key
                - name: CROWDSEC_MACHINE_PASSWORD_FILE
                  value: /secrets/machine-password
              volumeMounts:
                - name: credentials
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: credentials
              secret:
                secretName: blocklist-import-credentials