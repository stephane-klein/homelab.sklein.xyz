[tasks.deploy]
description = "Deploy CrowdSec LAPI + agent + blocklist-import CronJob"
run = "scripts/deploy.sh"

[tasks.destroy]
description = "Destroy CrowdSec (destructive: wipes LAPI decisions)"
run = "scripts/destroy.sh"

[tasks.status]
description = "Show CrowdSec status (bouncers, decisions, alerts, ingestion)"
run = "scripts/status.sh"

[tasks."blocklist-import:run"]
description = "Force an immediate run of the blocklist-import CronJob (external threat feeds)"
run = "scripts/run-blocklist-import-now.sh"

[tasks."blocklist-import:status"]
description = "Show blocklist-import status (imported decisions count + CronJob state)"
run = "scripts/blocklist-import-status.sh"

[tasks.purge]
description = "Purge expired decisions from the LAPI SQLite DB (prevents bloat and bouncer sync breakage)"
run = "scripts/purge-decisions.sh"