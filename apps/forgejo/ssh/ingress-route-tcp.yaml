# Routes git-over-SSH traffic from the internal Traefik TCP entrypoint `ssh`
# (bound on the Netbird IP 100.91.106.71:32222 — see scripts/deploy-traefik.sh)
# to Forgejo's SSH service.
#
# Result: ssh://git@forgejo.sklein.internal:32222/...
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forgejo-ssh
          port: 22
