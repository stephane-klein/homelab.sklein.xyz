# Helm values for Forgejo and its CloudNativePG database.
#
# Single values file referenced by both releases of helmfile.yaml (each chart
# ignores the keys that do not belong to it):
#   - release `forgejo-cluster` (cnpg/cluster) reads the `type`/`cluster`/`backups` blocks
#   - release `forgejo` (forgejo-helm) reads the `gitea`/`image`/`ingress`/... blocks
#
# Forgejo is exposed on the internal (Netbird VPN) ingress only:
#   https://forgejo.sklein.internal
#
# It is intentionally NOT behind Authelia: Forgejo manages its own accounts,
# tokens and SSH keys, and the HTTP endpoints (git clone, package/container
# registry, API) are consumed by programmatic clients.

# ---------------------------------------------------------------------------
# CloudNativePG cluster (release `forgejo-cluster`)
# ---------------------------------------------------------------------------

type: postgresql
mode: standalone
version:
  postgresql: "18"

cluster:
  instances: 1
  storage:
    size: 10Gi
  enableSuperuserAccess: true
  monitoring:
    enabled: true
    podMonitor:
      enabled: false
    prometheusRule:
      enabled: false
  affinity:
    nodeSelector:
      kubernetes.io/hostname: nuc-i7-gen11.homelab.stephane-klein.info
  initdb:
    database: forgejo
    owner: forgejo
  postgresql:
    parameters:
      max_wal_size: "256MB"
      min_wal_size: "64MB"
      wal_compression: "on"

# The operator creates the application-user Secret `forgejo-cluster-app`
# (keys: username, password, dbname, host, port) from the initdb owner above.
# Forgejo reads its DB credentials from that Secret (see `additionalConfigFromEnvs`).

backups:
  enabled: true
  provider: s3
  destinationPath: "s3://homelab-forgejo-backups/forgejo/"
  endpointURL: "https://s3.fr-par.scw.cloud"
  s3:
    bucket: homelab-forgejo-backups
    region: fr-par
    path: /forgejo
  retentionPolicy: "30d"
  scheduledBackups:
    - name: nightly-backup
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
  secret:
    create: false
    name: forgejo-cluster-backup-s3-creds

# ---------------------------------------------------------------------------
# Forgejo (release `forgejo`)
# ---------------------------------------------------------------------------

image:
  # Tag defaults to the chart's appVersion (the chart appends the `-rootless`
  # suffix automatically). No pin needed: the chart version is pinned.
  tag: ''

nodeSelector:
  kubernetes.io/hostname: nuc-i7-gen11.homelab.stephane-klein.info

persistence:
  enabled: true
  claimName: forgejo-data
  size: 20Gi
  storageClass: local-path

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    # Exposed over the internal Traefik TCP entrypoint `ssh` (Netbird IP only)
    # as forgejo.sklein.internal:32222 — see ssh/ingress-route-tcp.yaml.
    # The service stays ClusterIP; the rootless container listens on 2222.
    type: ClusterIP
    port: 22

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
  hosts:
    - host: forgejo.sklein.internal
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - secretName: forgejo-tls
      hosts:
        - forgejo.sklein.internal

gitea:
  admin:
    # Secret created by scripts/deploy.sh from Gopass (keys: username, password).
    existingSecret: forgejo-admin-secret
    email: contact@stephane-klein.info
    # Set the admin password once at first creation, then leave the user free
    # to change it later from the UI without it being reset on the next rollout.
    passwordMode: initialOnlyNoReset
  config:
    server:
      # Git over SSH is exposed on the internal Traefik TCP entrypoint `ssh`
      # (Netbird IP only) as forgejo.sklein.internal:32222.
      START_SSH_SERVER: true
      DISABLE_SSH: false
      SSH_PORT: 32222 # public port advertised in clone URLs
      SSH_LISTEN_PORT: 2222 # rootless image listens on 2222 inside the pod

    # External PostgreSQL. HOST/NAME/USER are not sensitive and match the
    # CNPG cluster in the same namespace; only PASSWD comes from the
    # `forgejo-cluster-app` Secret (auto-generated by the CNPG operator).
    database:
      DB_TYPE: postgres
      HOST: forgejo-cluster-rw:5432
      NAME: forgejo
      USER: forgejo

  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-cluster-app
          key: password
