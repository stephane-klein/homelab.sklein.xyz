[tasks.deploy]
description = "Deploy the private container registry (https://registry.sklein.internal)"
run = "scripts/deploy.sh"

[tasks.destroy]
description = "Destroy the private container registry"
run = "scripts/destroy.sh"

[tasks.list-images]
description = "List repositories in the private container registry"
run = "scripts/list-images.sh"

[tasks.list-tags]
description = "List tags of a repository in the private container registry"
usage = 'arg "<repo>" help="Repository name (e.g. whoami)"'
run = "scripts/list-tags.sh \"${usage_repo?}\""
